<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" font-family="Helvetica,Arial,sans-serif">
<rect width="1120" height="640" fill="#FFFFFF"/>
<defs><marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#444"/></marker></defs>
<text x="560.0" y="40" font-size="20" fill="#111" font-weight="bold" text-anchor="middle">View 1 — Standard Claude Code consuming Anthropic models (direct SaaS)</text>
<text x="560.0" y="64" font-size="12.5" fill="#555555" font-weight="normal" text-anchor="middle">No Azure landing zone / gateway · Anthropic-hosted · customer-managed API key or OAuth</text>
<rect x="120" y="100" width="380" height="150" rx="8" fill="#EAF1FB" stroke="#0F6CBD" stroke-width="1.6"/>
<text x="132" y="119" font-size="13.5" fill="#0F6CBD" font-weight="bold" text-anchor="start">Client surfaces</text>
<rect x="150" y="135" width="264" height="40" rx="5" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="1.1"/>
<text x="282.0" y="159.5" font-size="12.5" fill="#1A1A1A" font-weight="normal" text-anchor="middle">Claude Code — Web (claude.ai/code)</text>
<rect x="150" y="190" width="344" height="40" rx="5" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="1.1"/>
<text x="322.0" y="214.5" font-size="12.5" fill="#1A1A1A" font-weight="normal" text-anchor="middle">Claude Code — CLI (terminal / IDE extensions)</text>
<rect x="120" y="300" width="380" height="46" rx="6" fill="#FFF4CE" stroke="#C9A227" stroke-width="1.2"/>
<text x="310" y="328" font-size="12.5" fill="#7A5F00" font-weight="bold" text-anchor="middle">HTTPS / TLS · API key  (Ocp: Bearer)  or OAuth</text>
<rect x="640" y="100" width="360" height="150" rx="8" fill="#F4E3DC" stroke="#CC785C" stroke-width="1.6"/>
<text x="652" y="119" font-size="13.5" fill="#8A4B38" font-weight="bold" text-anchor="start">Anthropic (SaaS)</text>
<rect x="666" y="135" width="257" height="40" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="794.5" y="159.5" font-size="12.5" fill="#8A4B38" font-weight="normal" text-anchor="middle">Anthropic API — api.anthropic.com</text>
<rect x="666" y="190" width="315" height="40" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="823.5" y="214.5" font-size="12.5" fill="#8A4B38" font-weight="normal" text-anchor="middle">Claude models — Opus 4.x · Sonnet · Haiku</text>
<rect x="640" y="300" width="360" height="150" rx="8" fill="#F4E3DC" stroke="#CC785C" stroke-width="1.6"/>
<text x="652" y="319" font-size="13.5" fill="#8A4B38" font-weight="bold" text-anchor="start">Anthropic-side controls</text>
<rect x="666" y="330" width="177" height="30" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="754.5" y="348.96" font-size="11" fill="#8A4B38" font-weight="normal" text-anchor="middle">Org / workspace + members</text>
<rect x="851" y="330" width="139" height="30" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="920.5" y="348.96" font-size="11" fill="#8A4B38" font-weight="normal" text-anchor="middle">Usage &amp; rate limits</text>
<rect x="666" y="368" width="164" height="30" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="748.0" y="386.96" font-size="11" fill="#8A4B38" font-weight="normal" text-anchor="middle">Data-retention controls</text>
<rect x="838" y="368" width="81" height="30" rx="5" fill="#FFFFFF" stroke="#CC785C" stroke-width="1.1"/>
<text x="878.5" y="386.96" font-size="11" fill="#8A4B38" font-weight="normal" text-anchor="middle">Audit logs</text>
<line x1="500" y1="175" x2="640" y2="175" stroke="#444" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="570" y="165" font-size="11" fill="#555555" font-weight="normal" text-anchor="middle">prompt / completion</text>
<line x1="820" y1="250" x2="820" y2="300" stroke="#CC785C" stroke-width="1.6" marker-end="url(#arr)"/>
<text x="310" y="275" font-size="11" fill="#7A5F00" font-weight="normal" text-anchor="middle">auth on every call</text>
<line x1="310" y1="250" x2="310" y2="300" stroke="#C9A227" stroke-width="1.4" marker-end="url(#arr)"/>
<text x="560.0" y="500" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">Trust boundary: the client talks straight to Anthropic&#x27;s SaaS API. Governance (identity, quota, retention, audit) lives in the Anthropic org/workspace —</text>
<text x="560.0" y="520" font-size="12.5" fill="#222" font-weight="normal" text-anchor="middle">there is no Azure tenant, landing zone, APIM gateway, Entra, Defender or Purview in this path.</text>
</svg>
