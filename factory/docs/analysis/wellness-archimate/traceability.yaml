# Golden-Thread Traceability Backbone — Wellness Platform
#
# A machine-checkable model of the realization links across every architecture layer.
# Chain (forward = realization, more-concrete realizes more-abstract):
#   goal -> outcome -> requirement -> course_of_action -> capability -> process
#        -> app_component -> sbb -> solution_component -> oam_component
#
# Element IDs are the REAL IDs from the source artifacts (03/05/06/08/09/11/12/13/14/16/18).
# Where an artifact under-enumerates a layer (goals/outcomes), stable IDs are minted and
# the source line is noted in the label/source field.
#
# Validate with:  python3 check_traceability.py

chain:
  - goal
  - outcome
  - requirement
  - course_of_action
  - capability
  - process
  - app_component
  - sbb
  - solution_component
  - oam_component

# ---------------------------------------------------------------------------
# NODES — one block per layer. {id, layer, label}
# ---------------------------------------------------------------------------
nodes:

  # --- GOALS (03-motivation; 8 goals g1..g8, labels from coverage + lane themes) ---
  - { id: g1, layer: goal, label: "Improve member health outcomes (behaviour change)" }
  - { id: g2, layer: goal, label: "Sustain engagement via a credible reward economy" }
  - { id: g3, layer: goal, label: "Reproducible, frozen-on-publish, replayable scoring" }
  - { id: g4, layer: goal, label: "Loosely-coupled, event-driven, maintainable platform" }
  - { id: g5, layer: goal, label: "Trustworthy redemption & partner settlement" }
  - { id: g6, layer: goal, label: "Compliance & data protection (PDPL/ADHICS/AML) — realization hub" }
  - { id: g7, layer: goal, label: "Auditability & financial-grade integrity" }
  - { id: g8, layer: goal, label: "Member recognition & progression" }

  # --- OUTCOMES (03-motivation; 9 outcomes o1..o9, values from coverage analysis) ---
  - { id: o1, layer: outcome, label: "Eligible cohort correctly segmented & enrolled" }
  - { id: o2, layer: outcome, label: "Eligibility resolved <50ms" }
  - { id: o3, layer: outcome, label: "WeeklyScore = min(100, sum daily) computed deterministically" }
  - { id: o4, layer: outcome, label: "Points = WeeklyScore x10, capped, never reset (reward economy)" }
  - { id: o5, layer: outcome, label: "Redemption within 300s reservation, voucher issued" }
  - { id: o6, layer: outcome, label: "Settlement with 5% holdback, 30-day dispute window" }
  - { id: o7, layer: outcome, label: "Only verified signals score (verified-signal gate)" }
  - { id: o8, layer: outcome, label: "Nudges raise engagement" }
  - { id: o9, layer: outcome, label: "Scoring replayable from frozen {segmentId,segmentVersion}+ScoringPlan" }
  # The motivation view's measurable values concentrate on the member-facing flow (o1..o9).
  # The platform/governance requirements (challenge authoring, consent, integration, analytics,
  # fraud, progression) realize their goals through the operational/control outcomes below.
  # These are minted (source: 03 goals g2/g3/g4/g6/g7/g8 + coverage-analysis invariant set) so the
  # goal->outcome->requirement chain stays unbroken rather than letting requirements realize goals
  # directly (which the motivation metamodel also permits, but the strict chain does not model).
  - { id: o10, layer: outcome, label: "Challenges authored, bound to segments & published (frozen)" }   # source: 03 g3/g8, proc Challenge Creation
  - { id: o11, layer: outcome, label: "Consent captured & identity authenticated (PDPL/ADHICS)" }       # source: 03 g6 compliance hub
  - { id: o12, layer: outcome, label: "Services integrated on a versioned event spine" }                # source: 03 g4 loose-coupling
  - { id: o13, layer: outcome, label: "Analytics/insight produced without OLAP being source of truth" } # source: 03 g4/g7
  - { id: o14, layer: outcome, label: "Fraud & integrity violations blocked inline" }                   # source: 03 g7 integrity
  - { id: o15, layer: outcome, label: "Titles & progression awarded on recognition tiers" }             # source: 03 g8 recognition

