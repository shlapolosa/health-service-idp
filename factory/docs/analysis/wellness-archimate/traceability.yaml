# ---------------------------------------------------------------------------
# ACCEPTED GAPS — elements intentionally WITHOUT downstream realization.
# Declared so the checker treats them as expected, never silent breaks.
# Each is a behaviour/control/compliance obligation the OAM cannot express;
# they live in the services' REQUIREMENTS.md + platform policy/secrets.
# ---------------------------------------------------------------------------
accepted_gaps:
  - { id: r13, layer: requirement, reason: "AML / stored-value controls (coa8) are a cross-cutting control, not a deployable; carried in wallet-svc/fraud-svc REQUIREMENTS.md, no dedicated component." }
  - { id: r14, layer: requirement, reason: "PDPL data-subject rights are service-internal logic on consent-svc, not an OAM binding; carried in REQUIREMENTS.md." }

# Forward-only: these requirements DO reach a coa, so they are not forward-orphans.
# They are listed here as documented control obligations, not as a coa/capability gap.

# ---------------------------------------------------------------------------
# INVARIANTS — inv-1..inv-8 (cited across 13/14/16/19). Each links to the
# oam/app components it constrains + the REQUIREMENTS.md obligation it carries
# (the behaviour OAM cannot enforce). These are side-links, not chain edges.
# ---------------------------------------------------------------------------
invariants:
  - id: inv-1
    label: "Verified-signal gate — only verified signals score"
    binds: [verification-svc, malaffi-adapter, ac_verify, ac_malaffi]
    obligation: "verification-svc REQUIREMENTS.md: reject unverified activity/clinical signals before scoring (o7, r3)."
  - id: inv-2
    label: "Frozen-on-publish & replayable scoring"
    binds: [scoring-svc, cohort-svc, ac_scoring, ac_cohort]
    obligation: "scoring-svc REQUIREMENTS.md: version-pin {segmentId,segmentVersion}+ScoringPlan; event replay (g3, o9, c1)."
  - id: inv-3
    label: "Warehouse-not-source-of-truth (OLAP loose from OLTP)"
    binds: [analytics, event-spine, ac_analytics, ac_event]
    obligation: "analytics REQUIREMENTS.md: OLAP store is derived; OLTP postgres remains system of record (coa1)."
  - id: inv-4
    label: "Financial-grade wallet (two-phase, double-entry, idempotent)"
    binds: [wallet-svc, ac_wallet]
    obligation: "wallet-svc REQUIREMENTS.md: double-entry ledger, idempotent credits/debits (inv #4, coa4)."
  - id: inv-5
    label: "Inline fraud guard (synchronous gate + idempotency)"
    binds: [fraud-svc, ac_fraud]
    obligation: "fraud-svc REQUIREMENTS.md: synchronous fraud check on earn/redeem; idempotency keys (coa6, r12)."
  - id: inv-6
    label: "Versioned event spine (schema registry)"
    binds: [event-spine, ac_event]
    obligation: "event-spine REQUIREMENTS.md: schema-registered, versioned topics; backward-compatible evolution (coa2, r10)."
  - id: inv-7
    label: "Points economy (Points = WeeklyScore x10, cap 100, never reset)"
    binds: [scoring-svc, wallet-svc, ac_scoring, ac_wallet]
    obligation: "scoring/wallet REQUIREMENTS.md: deterministic points formula, score cap 100, no reset (o4, inv #7)."
  - id: inv-8
    label: "Redemption/settlement discipline (300s reservation, 5% holdback, 30-day dispute, irreversible withdrawal)"
    binds: [marketplace-svc, partner-settlement-svc, wallet-svc, ac_market, ac_partner]
    obligation: "marketplace/partner-settlement REQUIREMENTS.md: 300s reservation, 10s/3-retry, 5% holdback, 30-day dispute, 0.1% discrepancy (inv #8, coa4/coa5)."
